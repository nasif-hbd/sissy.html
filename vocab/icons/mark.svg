<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="VocabX">
  <defs>
    <linearGradient id="vxGrad" x1="10" y1="8" x2="66" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31c9ff"/><stop offset=".45" stop-color="#2f6bff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="vxDust" x1="28" y1="24" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <!-- the X, as two crossing bars -->
    <g id="vxBars">
      <path d="M6 10 L24 10 L114 110 L96 110 Z"/>
      <path d="M114 10 L96 10 L6 110 L24 110 Z"/>
    </g>
    <clipPath id="vxLeft"><rect x="0" y="0" width="59" height="120"/></clipPath>
    <clipPath id="vxRight"><rect x="61" y="0" width="59" height="120"/></clipPath>
  </defs>

  <use href="#vxBars" fill="url(#vxGrad)" clip-path="url(#vxLeft)"/>
  <use href="#vxBars" fill="#f2f4f8" clip-path="url(#vxRight)"/>

  <!-- two page edges along the upper-left arm: the book inside the X -->
  <g clip-path="url(#vxLeft)" fill="none" stroke="#f2f4f8" stroke-width="2.6" stroke-linecap="round">
    <path d="M12 12 L56 61"/>
    <path d="M19 11 L59 55"/>
  </g>

  <!-- pixels lifting off the page -->
  <g fill="url(#vxDust)">
    <rect x="36" y="8" width="8" height="8" rx="1.2"/>
    <rect x="47" y="0" width="5.5" height="5.5" rx="1"/>
    <rect x="30" y="1" width="4.5" height="4.5" rx="1"/>
    <rect x="47" y="14" width="3.5" height="3.5" rx="1"/>
  </g>
</svg>
