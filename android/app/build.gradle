/*
 * VocabX for Android — a Trusted Web Activity.
 *
 * There is no app code here, and that is the point. A TWA runs the site in
 * Chrome with the browser interface removed, so what installs on the phone is
 * the same app the website serves: the same service worker, the same offline
 * dictionary, the same update the moment the site updates. A second
 * implementation in Java would be a second thing to keep correct.
 *
 * The whole app is this file plus a manifest. `androidbrowserhelper` is
 * Google's own library for it, and it supplies the activity that opens the
 * site full-screen.
 */
plugins {
    id 'com.android.application'
}

android {
    namespace 'online.ylarena.vocabx'
    compileSdk 35

    defaultConfig {
        applicationId 'online.ylarena.vocabx'
        // 21 is Android 5.0. Below that there is no Chrome new enough to host
        // a TWA, so claiming support would install an app that cannot run.
        minSdk 21
        targetSdk 35

        // Bump both for every release you upload. Play rejects a versionCode
        // it has seen before, and the name is what people read.
        versionCode 1
        versionName '1.0'

        // These flow into AndroidManifest.xml and strings.xml. Change the host
        // here and nowhere else.
        manifestPlaceholders = [
            hostName            : 'vocabx.ylarena.online',
            defaultUrl          : 'https://vocabx.ylarena.online/vocab/',
            launcherName        : 'VocabX',
            // The colour behind the status bar and the launch screen. It is
            // the app's own ground, so the splash does not flash white.
            statusBarColorRes   : '@color/colorPrimary',
            navigationColorRes  : '@color/colorPrimary',
            splashScreenColorRes: '@color/backgroundColor',
        ]
    }

    /*
     * Signing. Play needs a signed release build, and the same key must sign
     * every future update — losing it means never being able to update this
     * app again.
     *
     * The key lives outside the repo. Put its details in keystore.properties
     * beside this file (it is gitignored) and this picks them up; without it,
     * the release build still assembles unsigned and `assembleDebug` works
     * regardless, so a fresh checkout is never blocked by a missing key.
     */
    signingConfigs {
        release {
            def secrets = rootProject.file('keystore.properties')
            if (secrets.exists()) {
                def props = new Properties()
                secrets.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Nothing to shrink: there is no app code, and R8 on an empty
            // module only adds a step that can fail.
            minifyEnabled false
            // Written as an if rather than a ternary argument: `signingConfig a
            // ? b : c` without parentheses is ambiguous to the Groovy parser,
            // and the error it gives points nowhere near this line.
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // So a debug build can sit on the phone next to a Play install.
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's TWA support library. It brings the LauncherActivity that opens
    // the site full-screen, and the splash-screen handling with it.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
