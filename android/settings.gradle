// Where Gradle looks for the Android plugin and the libraries. google() is
// Google's Maven, which is the only place the Android build tools are
// published — an offline machine cannot build an Android app at all.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "VocabX"
include ":app"
